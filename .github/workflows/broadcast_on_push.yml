name: Broadcast Newsletter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/content/thoughts/**'
      - 'src/content/maths/**'

jobs:
  broadcast:
    # Only run if commit message explicitly contains [broadcast] or [newsletter], or if manually triggered via GitHub Actions UI
    if: "contains(github.event.head_commit.message, '[broadcast]') || contains(github.event.head_commit.message, '[newsletter]') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Broadcast Newsletter
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: 'https://weptune.dev'
        run: |
          node scripts/broadcast_newsletter.mjs
